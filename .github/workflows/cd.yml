name: Release Pipeline

#here also add paths ignore for cd.yml to avoid triggering on changes to docs, readme, etc.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s-manifests/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/memory-leak-app
          tags: |
            type=raw,value=python-${{ matrix.python-version }}-sha-{{sha}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optional: Pass the version to Dockerfile if needed
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}

  update-manifest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Update image tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          MERGE_SHA: ${{ github.sha }} $(echo "${{ github.sha }}" | cut -c1-7)
        run: |
          for version in 3.11 3.12 3.13; do
            file="k8s-manifests/deployments/app-python-${version}.yaml"
            image="${DOCKERHUB_USERNAME}/memory-leak-app:python-${version}-${MERGE_SHA}"
            sed -i "s|image: .*|image: ${image}|" "$file"
          done

      - name: Commit manifest changes
        run: |
          git config --global user.name "github-app[bot]"
          git config --global user.email "github-app[bot]@users.noreply.github.com"
          git add k8s-manifests/deployments/
          if ! git diff --cached --quiet; then
            git commit -m "Update application image versions"
            git push origin HEAD:main
          else
            echo "No changes detected in manifest. Skipping push."
          fi