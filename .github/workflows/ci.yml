name: CI Pipeline

on:
  pull_request:
    branches:
      - main
    types: 
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'app/**'
      - 'test/**'
      - 'Dockerfile'
      - '.github/workflows/**'

permissions:
  contents: read

# This workflow will it will build an dtest the image include code quality and security scanning tools like  checking feature branch
# Code Linting (e.g., Flake8), Secret Scanning (Optional), SAST (Static Application Security Testing(ignore "0.0.0.0" related errors)), Unit test case(pytest) and Container Image Vulnerability Scanning.

jobs:
  test-lint-sast:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CI-only tools
        run: python -m pip install --upgrade pip pytest flake8 bandit

      - name: Unit tests
        run: python -m pytest -q test/

      - name: Flake8 lint
        run: flake8 app/app.py test/test_case.py --max-line-length=100

      - name: Bandit SAST
        # B104 is skipped because binding to 0.0.0.0 is required inside the container.
        run: bandit -r app -s B104 -ll

  secret-scan:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan (optional security gate)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-build-and-scan:
    if: github.event.pull_request.draft == false
    needs:
      - test-lint-sast
      - secret-scan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --pull --no-cache --build-arg PYTHON_VERSION=${{ matrix.python-version }} -t memory-app:python-${{ matrix.python-version }} .

      
      - name: Inspect package metadata
        run: |
          docker run --rm memory-app:python-${{ matrix.python-version }} \
          python -c "import importlib.metadata as m; print([(p, [(d.version, str(d._path)) for d in m.distributions() if d.metadata.get('Name', '').lower() == p]) for p in ['setuptools', 'urllib3', 'msgpack']])"

          docker run --rm memory-app:python-${{ matrix.python-version }} \
          sh -c 'find /usr/local/lib/python${{ matrix.python-version }}/site-packages -type f -name METADATA 2>/dev/null | grep -E "/(setuptools|urllib3|msgpack)-[^/]+\.dist-info/METADATA" || true'


      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: memory-app:python-${{ matrix.python-version }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
