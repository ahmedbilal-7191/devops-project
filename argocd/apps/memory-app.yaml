apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: memory-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ahmedbilal-7191/devops-project.git
    targetRevision: main
    path: k8s-manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: memory-app          # use your app namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
