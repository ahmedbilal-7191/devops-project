apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-app-python-312 
  namespace: memory-leak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-app
      runtime: python-3.12
  template:
    metadata:
      labels:
        app: memory-app
        runtime: python-3.12
    spec:
      serviceAccountName: memory-app-sa
      automountServiceAccountToken: false
      initContainers:
        - name: validate-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - test -f /config/APP_PORT && test -f /config/LOG_LEVEL
          volumeMounts:
            - name: app-config
              mountPath: /config
              readOnly: true
      containers:
        - name: memory-app
          image: bilal7191/memory-app:python-base
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: memory-app-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 400Mi
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
      volumes:
        - name: app-config
          configMap:
            name: memory-app-config