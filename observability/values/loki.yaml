deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    retention_period: 72h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi

# Turn off the distributed-mode components and extras
read:    { replicas: 0 }
write:   { replicas: 0 }
backend: { replicas: 0 }
gateway:      { enabled: false }
chunksCache:  { enabled: false }
resultsCache: { enabled: false }
lokiCanary:   { enabled: false }
test:         { enabled: false }
monitoring:
  selfMonitoring: { enabled: false }
  lokiCanary:     { enabled: false }
